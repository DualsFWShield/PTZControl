name: Build and Release PTZControl

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rust-x64:
    name: Build Release (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build PTZControl (x64)
        run: cargo build --release --target x86_64-pc-windows-msvc
        working-directory: RustControl

      - name: Upload PTZControl (x64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTZControl-x64
          path: RustControl/target/x86_64-pc-windows-msvc/release/PTZControl.exe

  create-release:
    name: Publish to GitHub Releases
    needs: [build-rust-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag and Release Information
        id: meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            TITLE="PTZControl ${{ github.ref_name }}"
            PRERELEASE="false"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TITLE="${{ github.event.release.name || github.event.release.tag_name }}"
            PRERELEASE="${{ github.event.release.prerelease }}"
          else
            TAG="latest"
            TITLE="PTZControl Latest Release"
            PRERELEASE="false"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: PTZControl-x64
          path: ./dist-x64

      - name: Prepare Release Executables and Archive
        shell: bash
        run: |
          # Standalone executable
          cp ./dist-x64/PTZControl.exe ./PTZControl.exe
          cp ./dist-x64/PTZControl.exe ./PTZControl-x64.exe

          # Zip bundle
          mkdir -p ./bundle
          cp ./dist-x64/PTZControl.exe ./bundle/PTZControl.exe
          [ -f README.md ] && cp README.md ./bundle/
          [ -f LICENSE ] && cp LICENSE ./bundle/
          (cd ./bundle && zip -r ../PTZControl.zip .)

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            ./PTZControl.exe
            ./PTZControl-x64.exe
            ./PTZControl.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
