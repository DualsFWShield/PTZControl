<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <defs>
    <linearGradient id="fullBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="iconAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <radialGradient id="lensGrad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left: Icon Mark (x=24, y=24, size=132x132) -->
  <g transform="translate(24, 24)">
    <rect width="132" height="132" rx="32" fill="url(#fullBgGrad)" stroke="#1e293b" stroke-width="2"/>

    <!-- Reticle Corners -->
    <path d="M 44 34 L 34 34 L 34 44" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 88 34 L 98 34 L 98 44" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 44 98 L 34 98 L 34 88" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 88 98 L 98 98 L 98 88" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>

    <!-- PTZ Axis Arcs -->
    <path d="M 30 66 A 36 36 0 0 1 66 30" fill="none" stroke="url(#iconAccent)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 102 66 A 36 36 0 0 1 66 102" fill="none" stroke="url(#iconAccent)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Lens -->
    <circle cx="66" cy="66" r="26" fill="url(#lensGrad)" stroke="#334155" stroke-width="2"/>
    <circle cx="66" cy="66" r="8" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="66" cy="66" r="3" fill="#38bdf8"/>
    <circle cx="96" cy="36" r="3" fill="#10b981" filter="url(#glow)"/>
  </g>

  <!-- Right: Typography -->
  <text x="184" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" letter-spacing="2" fill="url(#brandGrad)">PTZ</text>
  <text x="328" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="300" letter-spacing="1" fill="#f8fafc">CONTROL</text>

  <!-- Tagline / Subtitle -->
  <text x="186" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="6" fill="#64748b">PAN • TILT • ZOOM CONTROLLER</text>
</svg>
