[package]
name = "ptzcontrol"
version = "4.0.0"
edition = "2021"
rust-version = "1.81"
description = "Modern PTZ camera control for Windows"
license = "GPL-3.0-or-later"
repository = "https://github.com/xMRi-Software/PTZControl"

[[bin]]
name = "PTZControl"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_DirectShow",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[package.metadata.winres]
OriginalFilename = "PTZControl.exe"
FileDescription = "PTZControl - Modern PTZ camera control"
ProductName = "PTZControl"
LegalCopyright = "Copyright (C) 2026 PTZControl contributors - GPL-3.0-or-later"
