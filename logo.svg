<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Accent Gradient (Cyan to Indigo) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Lens Flare / Reflection -->
    <radialGradient id="lensCore" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Precision Dial / Outer PTZ Ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 8"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Pan / Tilt Directional Track Arcs -->
  <path d="M 120 256 A 136 136 0 0 1 256 120" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
  <path d="M 392 256 A 136 136 0 0 1 256 392" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Pan-Tilt Arrows -->
  <!-- Top Tilt Arrow -->
  <polygon points="256,104 263,116 249,116" fill="#38bdf8"/>
  <!-- Bottom Tilt Arrow -->
  <polygon points="256,408 263,396 249,396" fill="#6366f1"/>
  <!-- Left Pan Arrow -->
  <polygon points="104,256 116,249 116,263" fill="#38bdf8"/>
  <!-- Right Pan Arrow -->
  <polygon points="408,256 396,249 396,263" fill="#6366f1"/>

  <!-- Zoom Reticle / Corner Brackets -->
  <path d="M 172 204 L 172 172 L 204 172" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 340 204 L 340 172 L 308 172" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 172 308 L 172 340 L 204 340" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 340 308 L 340 340 L 308 340" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Camera Outer Bezel -->
  <circle cx="256" cy="256" r="102" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <circle cx="256" cy="256" r="92" fill="#0b0f19" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Camera Lens Core -->
  <circle cx="256" cy="256" r="76" fill="url(#lensCore)"/>

  <!-- Iris Aperture Blades / Gimbal Blades (Subtle) -->
  <circle cx="256" cy="256" r="54" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="14 10"/>

  <!-- Lens Center Target / Sensor -->
  <circle cx="256" cy="256" r="24" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="256" cy="256" r="8" fill="#38bdf8"/>

  <!-- Specular Lens Highlights -->
  <ellipse cx="236" cy="236" rx="22" ry="12" transform="rotate(-40 236 236)" fill="#ffffff" fill-opacity="0.18"/>
  <ellipse cx="274" cy="274" rx="10" ry="5" transform="rotate(-40 274 274)" fill="#38bdf8" fill-opacity="0.25"/>

  <!-- Active Status Indicator -->
  <circle cx="340" cy="156" r="5" fill="#10b981" filter="url(#neonGlow)"/>
</svg>
